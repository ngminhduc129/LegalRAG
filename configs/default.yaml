# Legal RAG Experiment Configuration

# Corpus settings
corpus:
  document_id: "labor_code_2019"
  pdf_path: "data/raw/Văn-bản-hợp-nhất-125-VBHN-VPQH.pdf"
  document_name: "Bộ luật Lao động"
  document_number: "125/VBHN-VPQH"
  expected_articles: 220

# Chunking strategies
chunking:
  legal_aware:
    enabled: true
    preserve_hierarchy: true
    chunk_types: ["article_intro", "clause", "clause_intro", "point"]
  
  baselines:
    fixed_size:
      - chunk_size: 300
        overlap: 60
      - chunk_size: 500
        overlap: 100
      - chunk_size: 800
        overlap: 160
    paragraph: true
    article: true
    clause: true

# Retrieval settings
retrieval:
  bm25:
    enabled: true
    tokenizer: "underthesea"  # or "pyvi"
    k1: 1.5
    b: 0.75
  
  dense:
    enabled: true
    model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
    device: "cuda"
    batch_size: 32
  
  hybrid:
    enabled: true
    fusion_method: "rrf"  # or "weighted"
    rrf_k: 60
    weight_bm25: 0.5
    weight_dense: 0.5
  
  reranker:
    enabled: false
    model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    top_k: 50

# Evaluation settings
evaluation:
  retrieval_k: [1, 3, 5, 10, 20]
  metrics: ["recall", "precision", "mrr", "ndcg"]
  generation_metrics: ["correctness", "faithfulness", "citation_accuracy", "completeness", "hallucination_rate"]
  
  # Test set (frozen)
  test_set_path: "data/qa/test.jsonl"
  dev_set_path: "data/qa/dev.jsonl"

# Generation settings
generation:
  llm:
    model: "gpt-4o-mini"  # or local model
    temperature: 0.0
    max_tokens: 1024
  
  prompt:
    system: "You are a legal assistant for Vietnamese Labor Law. Answer based ONLY on the provided context. Cite specific Articles/Clauses/Points."
    template: |
      Context:
      {context}
      
      Question: {question}
      
      Answer (with citations):
  
  citation_format: "[Điều {article}, Khoản {clause}, Điểm {point}]"

# Experiment tracking
experiment:
  seed: 42
  run_id: "auto"  # auto-generated timestamp
  output_dir: "experiments"
  log_level: "INFO"