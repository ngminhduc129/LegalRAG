# Generation Configuration

llm:
  model: "gpt-4o-mini"
  temperature: 0.0
  max_tokens: 1024

prompt:
  system: "You are a legal assistant for Vietnamese Labor Law. Answer based ONLY on the provided context. Cite specific Articles/Clauses/Points."
  template: |
    Context:
    {context}

    Question: {question}

    Answer (with citations):

citation_format: "[Điều {article}, Khoản {clause}, Điểm {point}]"